name: Build Fazua Monitor APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify BLE parsers
        run: |
          mkdir -p tests/bin
          javac -d tests/bin watch/src/main/java/cz/ride/fazuawatch/TelemetryParser.java tests/TelemetryParserTest.java
          java -cp tests/bin TelemetryParserTest
      - name: Build debug APK for Wear OS
        run: gradle --no-daemon :watch:assembleDebug
      - name: Publish APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazua-monitor-wearos-debug-apk
          path: watch/build/outputs/apk/debug/watch-debug.apk
          if-no-files-found: error
